<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Rabiyacollections CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#3b1530;min-height:100vh;display:flex;align-items:center}
    .card{border:0;box-shadow:0 8px 32px rgba(0,0,0,.35)}
    .brand{color:#3b1530;font-weight:700}
    .gold{color:#b8860b}
    .btn-gold{background:#b8860b;border-color:#b8860b;color:#fff}
    .btn-gold:hover{background:#9a7209;color:#fff}
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card p-4">
        <h1 class="h4 brand mb-1">Rabiyacollections</h1>
        <p class="text-muted small mb-4">CRM admin sign-in · <span class="gold">22 years of trust</span></p>
        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next','')) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required {% if locked %}disabled{% endif %}>
          </div>
          <button class="btn btn-gold w-100" type="submit" {% if locked %}disabled{% endif %}>Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
