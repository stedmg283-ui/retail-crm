{% extends "base.html" %}
{% block title %}New PO{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New purchase order</h1>
<form method="post" class="card p-3" id="po-form">
  <div class="row g-2 mb-3">
    <div class="col-md-4">
      <label class="form-label">Supplier</label>
      <select name="supplier_id" class="form-select" required>
        {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3"><label class="form-label">Bill number</label><input name="bill_number" class="form-control" required></div>
    <div class="col-md-3"><label class="form-label">Date</label><input type="date" name="po_date" class="form-control" value="{{ '' }}"></div>
  </div>
  <table class="table" id="lines">
    <thead><tr><th>Item</th><th>Qty</th><th>Unit cost</th></tr></thead>
    <tbody>
      <tr>
        <td><input name="item_name" class="form-control" required></td>
        <td><input name="quantity" type="number" step="0.01" value="1" class="form-control"></td>
        <td><input name="unit_cost" type="number" step="0.01" value="0" class="form-control"></td>
      </tr>
    </tbody>
  </table>
  <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addLine()">+ Line</button>
  <div class="mb-2"><textarea name="notes" class="form-control" placeholder="Notes"></textarea></div>
  <button class="btn btn-primary">Create PO</button>
</form>
<script>
function addLine() {
  const tb = document.querySelector('#lines tbody');
  const tr = tb.rows[0].cloneNode(true);
  tr.querySelectorAll('input').forEach(i => { if (i.name==='item_name') i.value=''; else if (i.name==='quantity') i.value='1'; else i.value='0'; });
  tb.appendChild(tr);
}
</script>
{% endblock %}
