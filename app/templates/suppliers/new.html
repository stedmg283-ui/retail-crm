{% extends "base.html" %}
{% block title %}New supplier{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Add supplier</h1>
<form method="post" class="card p-3 col-md-6">
  <div class="mb-2"><label class="form-label">Name</label><input name="name" class="form-control" required></div>
  <div class="mb-2"><label class="form-label">Contact</label><input name="contact_name" class="form-control"></div>
  <div class="mb-2"><label class="form-label">Phone</label><input name="phone" class="form-control"></div>
  <div class="mb-2"><label class="form-label">Email</label><input name="email" class="form-control"></div>
  <div class="mb-2"><label class="form-label">GSTIN</label><input name="gstin" class="form-control"></div>
  <div class="mb-2"><label class="form-label">Address</label><textarea name="address" class="form-control"></textarea></div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
