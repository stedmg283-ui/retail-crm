{% extends "base.html" %}
{% block title %}Suppliers{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Suppliers</h1>
<div class="row g-4">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h2 class="h5">Add Supplier</h2>
      <form method="post">
        <div class="mb-2"><input name="name" class="form-control" placeholder="Name *" required></div>
        <div class="mb-2"><input name="contact_name" class="form-control" placeholder="Contact"></div>
        <div class="mb-2"><input name="phone" class="form-control" placeholder="Phone"></div>
        <div class="mb-2"><input name="email" class="form-control" placeholder="Email"></div>
        <div class="mb-2"><input name="gstin" class="form-control" placeholder="GSTIN"></div>
        <div class="mb-2"><input name="state_code" class="form-control" placeholder="State code (e.g. 29)"></div>
        <div class="mb-2"><textarea name="address" class="form-control" placeholder="Address"></textarea></div>
        <button class="btn btn-primary">Save</button>
      </form>
    </div></div>
  </div>
  <div class="col-md-7">
    <table class="table table-sm bg-white shadow-sm">
      <thead><tr><th>Name</th><th>GSTIN</th><th>Phone</th><th>Outstanding</th></tr></thead>
      <tbody>
      {% for s in suppliers %}
        <tr>
          <td>{{ s.name }}</td>
          <td>{{ s.gstin or '—' }}</td>
          <td>{{ s.phone or '—' }}</td>
          <td>₹ {{ '{:,.2f}'.format(s.outstanding_balance()) }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
