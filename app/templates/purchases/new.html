{% extends "base.html" %}
{% block title %}New Supplier Bill{% endblock %}
{% block content %}
<h1 class="h3 mb-3">New Supplier Bill</h1>
<form method="post">
  <div class="row g-3 mb-3">
    <div class="col-md-4">
      <label class="form-label">Supplier</label>
      <select name="supplier_id" class="form-select" required>
        {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Bill Number</label>
      <input name="bill_number" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Supply</label>
      <select name="place_of_supply" class="form-select">
        <option value="intra">Intra (CGST+SGST)</option>
        <option value="inter">Inter (IGST)</option>
      </select>
    </div>
  </div>
  <table class="table table-sm bg-white shadow-sm">
    <thead><tr><th>Item</th><th>HSN</th><th>Qty</th><th>Unit Cost</th><th>GST%</th><th></th></tr></thead>
    <tbody id="lines">
      <tr>
        <td><input name="item_name[]" class="form-control form-control-sm" required></td>
        <td><input name="hsn[]" class="form-control form-control-sm" value="6211"></td>
        <td><input name="quantity[]" type="number" step="0.01" class="form-control form-control-sm" value="1"></td>
        <td><input name="unit_cost[]" type="number" step="0.01" class="form-control form-control-sm" value="0"></td>
        <td><input name="gst_rate[]" type="number" step="0.01" class="form-control form-control-sm" value="5"></td>
        <td></td>
      </tr>
    </tbody>
  </table>
  <button type="button" class="btn btn-sm btn-outline-primary mb-3" onclick="addLineRow('lines','po-line-tpl')">+ Row</button>
  <template id="po-line-tpl">
    <tr>
      <td><input name="item_name[]" class="form-control form-control-sm"></td>
      <td><input name="hsn[]" class="form-control form-control-sm" value="6211"></td>
      <td><input name="quantity[]" type="number" step="0.01" class="form-control form-control-sm" value="1"></td>
      <td><input name="unit_cost[]" type="number" step="0.01" class="form-control form-control-sm" value="0"></td>
      <td><input name="gst_rate[]" type="number" step="0.01" class="form-control form-control-sm" value="5"></td>
      <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">×</button></td>
    </tr>
  </template>
  <div class="mb-3"><textarea name="notes" class="form-control" placeholder="Notes"></textarea></div>
  <button class="btn btn-success">Save Bill</button>
</form>
{% endblock %}
