{% extends "base.html" %}
{% block title %}Employees{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Employees</h1>
<div class="row g-4">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <form method="post">
        <div class="mb-2"><input name="name" class="form-control" placeholder="Name *" required></div>
        <div class="mb-2"><input name="role" class="form-control" value="Sales Associate"></div>
        <div class="mb-2"><input name="phone" class="form-control" placeholder="Phone"></div>
        <div class="mb-2">
          <select name="shift" class="form-select"><option>Day</option><option>Evening</option></select>
        </div>
        <div class="row g-2 mb-2">
          <div class="col"><input name="shift_start" type="time" class="form-control" value="10:00"></div>
          <div class="col"><input name="shift_end" type="time" class="form-control" value="19:00"></div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col">
            <select name="rate_type" class="form-select"><option value="daily">Daily</option><option value="hourly">Hourly</option></select>
          </div>
          <div class="col"><input name="rate_amount" type="number" step="0.01" class="form-control" placeholder="Rate ₹" required></div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col"><input name="pf_percent" type="number" step="0.01" class="form-control" placeholder="PF %" value="0"></div>
          <div class="col"><input name="esi_percent" type="number" step="0.01" class="form-control" placeholder="ESI %" value="0"></div>
        </div>
        <button class="btn btn-primary">Add Employee</button>
      </form>
    </div></div>
  </div>
  <div class="col-md-7">
    <table class="table table-sm bg-white shadow-sm">
      <thead><tr><th>Name</th><th>Role</th><th>Shift</th><th>Rate</th><th>Active</th></tr></thead>
      <tbody>
      {% for e in employees %}
        <tr>
          <td>{{ e.name }}</td><td>{{ e.role }}</td><td>{{ e.shift }}</td>
          <td>₹{{ e.rate_amount }}/{{ e.rate_type }}</td>
          <td>{{ 'yes' if e.is_active else 'no' }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
