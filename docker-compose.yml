services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: retail_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d retail_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://crm:crm@db:5432/retail_crm
      SECRET_KEY: docker-dev-secret-change-me
      FLASK_ENV: development
    volumes:
      - ./invoices:/app/invoices
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
